<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 Farming Life - RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">🌾 Farming</div>

            <div class="player-card">
                <div class="player-name" id="sidebarName">Muller</div>
                <div class="player-money" id="sidebarMoney">$0</div>
                <div class="player-level" id="sidebarLevel">Level 1</div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a class="nav-link active" onclick="setPage('dashboard')">
                        <span class="nav-icon">📊</span>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="setPage('farm')">
                        <span class="nav-icon">🌾</span>
                        My Farm
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link in-progress" onclick="setPage('properties')">
                        <span class="nav-icon">🏡</span>
                        Properties
                        <span class="badge-in-progress">In Progress</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link in-progress" onclick="setPage('market')">
                        <span class="nav-icon">🛒</span>
                        Market
                        <span class="badge-in-progress">In Progress</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="setPage('inventory')">
                        <span class="nav-icon">🎒</span>
                        Inventory
                    </a>
                </li>
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- HEADER -->
            <div class="header">
                <h1 class="header-title" id="pageTitle">Dashboard</h1>
                <div class="header-stats">
                    <div class="stat-box">
                        <span class="stat-icon">💰</span>
                        <div>
                            <div class="stat-value" id="headerMoney">0</div>
                            <div class="stat-label">Money</div>
                        </div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-icon">📈</span>
                        <div>
                            <div class="stat-value" id="headerLevel">1</div>
                            <div class="stat-label">Level</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONTENT -->
            <div class="content-area">
                <div id="farms-section"></div>
            </div>
        </main>
    </div>

    <!-- MODAL PLANTAR -->
    <div id="plantModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">🌱 Choose a Crop</h2>
                <button class="modal-close" onclick="closePlantModal()">✕</button>
            </div>
            <ul id="cropsList" class="crop-list"></ul>
        </div>
    </div>

    <!-- MODAL VENDER -->
    <div id="sellModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">💸 Sell Crop</h2>
                <button class="modal-close" onclick="closeSellModal()">✕</button>
            </div>
            <div id="sellInfo"></div>
        </div>
    </div>

    <!-- MESSAGE -->
    <div id="message" class="message"></div>

    <script src="script.js"></script>
</body>
</html>
