<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 Farming Life - RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #DDE7DF;
            --green-ag: #6FAF78;
            --green-dark: #315C3C;
            --yellow-gold: #F2C75C;
            --orange-soft: #E99A5B;
            --blue-sky: #72AFC4;
            --pink-soft: #D98FA3;
            --shadow-dark: rgba(110, 125, 115, 0.15);
            --shadow-light: rgba(255, 255, 255, 0.8);
            --text-primary: #315C3C;
            --text-secondary: #5A6E63;
            --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-base) 0%, #EBF0ED 100%);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* ═══════════════════════════════════════════════════════════════ */
        /* SIDEBAR */
        /* ═══════════════════════════════════════════════════════════════ */

        .sidebar {
            width: 250px;
            background: var(--bg-base);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 16px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: 2em;
            font-weight: 800;
            color: var(--green-dark);
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -1px;
        }

        .player-card {
            background: var(--bg-base);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: inset 2px 2px 8px var(--shadow-dark), inset -2px -2px 8px var(--shadow-light), 4px 4px 12px var(--shadow-dark);
            text-align: center;
        }

        .player-name {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--green-dark);
            margin-bottom: 8px;
        }

        .player-money {
            font-size: 1.4em;
            font-weight: 800;
            color: var(--yellow-gold);
            margin: 8px 0;
        }

        .player-level {
            font-size: 0.85em;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-menu {
            list-style: none;
            flex-grow: 1;
            margin-bottom: 30px;
        }

        .nav-item {
            margin-bottom: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-base);
            box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
        }

        .nav-link:hover {
            color: var(--green-dark);
            box-shadow: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--green-ag) 0%, #5C9967 100%);
            color: white;
            box-shadow: 4px 4px 12px rgba(111, 175, 120, 0.3);
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 1.2em;
        }

        /* ═══════════════════════════════════════════════════════════════ */
        /* MAIN CONTENT */
        /* ═══════════════════════════════════════════════════════════════ */

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 30px;
            background: var(--bg-base);
            border-radius: 20px;
            box-shadow: 6px 6px 14px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
        }

        .header-title {
            font-size: 2em;
            font-weight: 800;
            color: var(--green-dark);
            letter-spacing: -0.5px;
        }

        .header-stats {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-base);
            padding: 10px 16px;
            border-radius: 14px;
            box-shadow: inset 1px 1px 4px var(--shadow-dark), inset -1px -1px 4px var(--shadow-light);
        }

        .stat-icon {
            font-size: 1.3em;
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: 800;
            color: var(--green-ag);
        }

        .stat-label {
            font-size: 0.75em;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* CONTENT AREA */
        .content-area {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .section {
            background: var(--bg-base);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 6px 6px 14px var(--shadow-dark), -2px -2px 8px var(--shadow-light);
        }

        .section-title {
            font-size: 1.5em;
            font-weight: 800;
            color: var(--green-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* PLOTS GRID */
        .plots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 18px;
        }

        .plot-card {
            background: linear-gradient(135deg, var(--bg-base) 0%, #E8F1EA 100%);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 6px 6px 14px var(--shadow-dark), -3px -3px 8px var(--shadow-light);
            border: 2px solid transparent;
            position: relative;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .plot-card:hover {
            transform: translateY(-6px);
            box-shadow: 8px 8px 18px rgba(111, 175, 120, 0.2), -3px -3px 8px var(--shadow-light);
        }

        .plot-card.with-crop {
            background: linear-gradient(135deg, #C8E6D0 0%, #B8DEC5 100%);
            border-color: var(--green-ag);
        }

        .plot-card.ready {
            background: linear-gradient(135deg, #FFF4D6 0%, #FFE9B5 100%);
            border-color: var(--yellow-gold);
            box-shadow: 6px 6px 14px rgba(242, 199, 92, 0.25), -3px -3px 8px var(--shadow-light);
        }

        .plot-name {
            font-size: 0.9em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .plot-emoji {
            font-size: 2.5em;
            margin: 8px 0;
        }

        .plot-crop-name {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .plot-status {
            font-size: 0.75em;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .plot-time {
            font-size: 0.8em;
            font-weight: 700;
            color: var(--green-ag);
            margin-top: 6px;
        }

        .plot-time.countdown {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            font-weight: 800;
            color: var(--blue-sky);
            background: rgba(114, 175, 196, 0.1);
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-block;
        }

        .plot-price {
            font-size: 0.75em;
            color: var(--yellow-gold);
            font-weight: 700;
            margin-top: 4px;
        }

        /* BUTTONS */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Nunito Sans', sans-serif;
            box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
        }

        .btn:active {
            box-shadow: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--green-ag) 0%, #5C9967 100%);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 6px 6px 14px rgba(111, 175, 120, 0.3), -2px -2px 8px var(--shadow-light);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-base);
            color: var(--green-ag);
            border: 2px solid var(--green-ag);
        }

        .btn-secondary:hover {
            background: var(--green-ag);
            color: white;
        }

        .btn-sell {
            background: linear-gradient(135deg, var(--yellow-gold) 0%, #E8B94D 100%);
            color: var(--text-primary);
        }

        .btn-sell:hover {
            box-shadow: 6px 6px 14px rgba(242, 199, 92, 0.3);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(49, 92, 60, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-base);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 12px 12px 24px var(--shadow-dark), -4px -4px 12px var(--shadow-light);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: 800;
            color: var(--green-dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: var(--green-dark);
        }

        .crop-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .crop-item {
            background: linear-gradient(135deg, #F5F8F6 0%, #EDF1ED 100%);
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 4px solid var(--green-ag);
            box-shadow: 3px 3px 8px var(--shadow-dark), inset -1px -1px 3px var(--shadow-light);
        }

        .crop-item:hover {
            background: linear-gradient(135deg, var(--green-ag) 0%, #5C9967 100%);
            color: white;
            border-left-color: white;
            transform: translateX(4px);
            box-shadow: 4px 4px 10px rgba(111, 175, 120, 0.25);
        }

        .crop-item:hover .crop-name,
        .crop-item:hover .crop-info {
            color: white;
        }

        .crop-name {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-size: 1em;
        }

        .crop-info {
            font-size: 0.85em;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
        }

        .crop-price {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--yellow-gold);
        }

        /* MESSAGE */
        .message {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 600;
            z-index: 999;
            animation: slideInUp 0.3s ease-out;
            box-shadow: 6px 6px 14px var(--shadow-dark);
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: linear-gradient(135deg, var(--green-ag) 0%, #5C9967 100%);
            color: white;
        }

        .message.error {
            background: linear-gradient(135deg, var(--orange-soft) 0%, #D97A48 100%);
            color: white;
        }

        @keyframes slideInUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* LOADING */
        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1em;
            padding: 40px;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--green-ag);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--green-dark);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">🌾 Farming</div>

            <div class="player-card">
                <div class="player-name" id="sidebarName">Muller</div>
                <div class="player-money" id="sidebarMoney">$0</div>
                <div class="player-level" id="sidebarLevel">Level 1</div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a class="nav-link active" onclick="setPage('dashboard')">
                        <span class="nav-icon">📊</span>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="setPage('farm')">
                        <span class="nav-icon">🌾</span>
                        My Farm
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="setPage('properties')">
                        <span class="nav-icon">🏡</span>
                        Properties
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="setPage('market')">
                        <span class="nav-icon">🛒</span>
                        Market
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" onclick="setPage('inventory')">
                        <span class="nav-icon">🎒</span>
                        Inventory
                    </a>
                </li>
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- HEADER -->
            <div class="header">
                <h1 class="header-title" id="pageTitle">Dashboard</h1>
                <div class="header-stats">
                    <div class="stat-box">
                        <span class="stat-icon">💰</span>
                        <div>
                            <div class="stat-value" id="headerMoney">0</div>
                            <div class="stat-label">Money</div>
                        </div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-icon">📈</span>
                        <div>
                            <div class="stat-value" id="headerLevel">1</div>
                            <div class="stat-label">Level</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONTENT -->
            <div class="content-area">
                <div id="farms-section"></div>
            </div>
        </main>
    </div>

    <!-- MODAL PLANTAR -->
    <div id="plantModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">🌱 Choose a Crop</h2>
                <button class="modal-close" onclick="closePlantModal()">✕</button>
            </div>
            <ul id="cropsList" class="crop-list"></ul>
        </div>
    </div>

    <!-- MODAL VENDER -->
    <div id="sellModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">💸 Sell Crop</h2>
                <button class="modal-close" onclick="closeSellModal()">✕</button>
            </div>
            <div id="sellInfo"></div>
        </div>
    </div>

    <!-- MESSAGE -->
    <div id="message" class="message"></div>

    <script>
        const API_BASE = "http://localhost:5000/api";
        const PLAYER_ID = 2;

        let currentPlotId = null;
        let currentCropId = null;
        let cropTypes = [];
        let prices = {};
        let currentPage = "dashboard";

        // ════════════════════════════════════════════════════════════════
        // INICIALIZACIÓN
        // ════════════════════════════════════════════════════════════════

        async function init() {
            try {
                await loadPlayer();
                await loadPrices();
                await loadCropTypes();
                await loadFarms();
            } catch (error) {
                showMessage("Error: " + error.message, "error");
            }
        }

        // ════════════════════════════════════════════════════════════════
        // CARGAR DATOS
        // ════════════════════════════════════════════════════════════════

        async function loadPlayer() {
            const response = await fetch(`${API_BASE}/player/${PLAYER_ID}`);
            if (!response.ok) throw new Error("No se pudo cargar el jugador");

            const player = await response.json();
            document.getElementById("sidebarName").textContent = player.name;
            document.getElementById("sidebarMoney").textContent = `$${player.money.toLocaleString()}`;
            document.getElementById("sidebarLevel").textContent = `Level ${player.level}`;
            document.getElementById("headerMoney").textContent = player.money.toLocaleString();
            document.getElementById("headerLevel").textContent = player.level;
        }

        async function loadPrices() {
            const response = await fetch(`${API_BASE}/prices`);
            if (!response.ok) throw new Error("No se pudo cargar precios");

            const pricesData = await response.json();
            pricesData.forEach(p => {
                prices[p.crop_type_id] = {
                    seed_price: p.seed_price,
                    crop_price: p.crop_price
                };
            });
        }

        async function loadCropTypes() {
            const response = await fetch(`${API_BASE}/crop-types`);
            if (!response.ok) throw new Error("No se pudo cargar tipos de cultivos");
            cropTypes = await response.json();
        }

        // Helper: Parse timestamp as UTC
        function parseUTCDate(dateString) {
            // Ensure Z suffix for UTC interpretation
            if (!dateString.includes('Z') && !dateString.includes('+')) {
                dateString += 'Z';
            }
            return new Date(dateString);
        }

        async function loadFarms() {
            const response = await fetch(`${API_BASE}/player/${PLAYER_ID}/houses`);
            if (!response.ok) throw new Error("No se pudo cargar las casas");

            const houses = await response.json();

            if (houses.length === 0) {
                document.getElementById("farms-section").innerHTML = `
                    <div class="section">
                        <div class="section-title">🌾 My Farms</div>
                        <p style="color: var(--text-secondary);">No tienes granjas aún.</p>
                    </div>
                `;
                return;
            }

            let farmsHTML = '';

            for (const house of houses) {
                const plotsResponse = await fetch(`${API_BASE}/house/${house.id}/plots`);
                const plots = await plotsResponse.json();

                farmsHTML += `
                    <div class="section">
                        <div class="section-title">🌾 ${house.name}</div>
                        <div class="plots-grid">
                `;

                for (const plot of plots) {
                    const cropResponse = await fetch(`${API_BASE}/plot/${plot.id}/crop`);
                    const { crop } = await cropResponse.json();

                    if (crop) {
                        const cropType = crop.crop_types.name;
                        const readyAt = parseUTCDate(crop.ready_at);
                        const now = new Date();
                        const isReady = now >= readyAt;

                        if (isReady) {
                            const cropPrice = prices[crop.crop_type_id]?.crop_price || 0;
                            const totalValue = crop.yield_amount * cropPrice;
                            farmsHTML += `
                                <div class="plot-card ready" onclick="harvestAndSell(${crop.id}, '${cropType}', ${crop.yield_amount}, ${cropPrice})">
                                    <div class="plot-name">${plot.name}</div>
                                    <div class="plot-emoji">🌾</div>
                                    <div class="plot-crop-name">${cropType}</div>
                                    <div class="plot-price">💰 $${totalValue}</div>
                                    <div class="plot-status">✨ Ready!</div>
                                </div>
                            `;
                        } else {
                            const timeLeftMs = readyAt - now;
                            const hours = Math.floor(timeLeftMs / 3600000);
                            const minutes = Math.floor((timeLeftMs % 3600000) / 60000);
                            const seconds = Math.floor((timeLeftMs % 60000) / 1000);
                            const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                            const cropPrice = prices[crop.crop_type_id]?.crop_price || 0;
                            const totalValue = crop.yield_amount * cropPrice;

                            farmsHTML += `
                                <div class="plot-card with-crop" id="plot-${crop.id}" data-crop-id="${crop.id}" data-crop-name="${cropType}" data-yield="${crop.yield_amount}" data-price="${cropPrice}" data-total="${totalValue}">
                                    <div class="plot-name">${plot.name}</div>
                                    <div class="plot-emoji">🌱</div>
                                    <div class="plot-crop-name">${cropType}</div>
                                    <div class="plot-time countdown" id="time-${crop.id}">${timeStr}</div>
                                </div>
                            `;
                        }
                    } else {
                        farmsHTML += `
                            <div class="plot-card" onclick="openPlantModal(${plot.id})">
                                <div class="plot-name">${plot.name}</div>
                                <div class="plot-emoji">🌱</div>
                                <div class="plot-status">Click to plant</div>
                            </div>
                        `;
                    }
                }

                farmsHTML += `</div></div>`;
            }

            document.getElementById("farms-section").innerHTML = farmsHTML;
        }

        // ════════════════════════════════════════════════════════════════
        // ACCIONES - PLANTAR
        // ════════════════════════════════════════════════════════════════

        function openPlantModal(plotId) {
            currentPlotId = plotId;

            const cropsListHTML = cropTypes.map(crop => {
                const seedPrice = prices[crop.id]?.seed_price || 0;
                return `
                <li class="crop-item" onclick="plantCrop(${crop.id}, ${seedPrice})">
                    <div class="crop-name">🌾 ${crop.name}</div>
                    <div class="crop-info">
                        <span>⏱️ ${Math.floor(crop.growth_time / 60)}m</span>
                        <span class="crop-price">🌱 $${seedPrice}</span>
                    </div>
                </li>
            `}).join("");

            document.getElementById("cropsList").innerHTML = cropsListHTML;
            document.getElementById("plantModal").classList.add("active");
        }

        function closePlantModal() {
            document.getElementById("plantModal").classList.remove("active");
        }

        async function plantCrop(cropTypeId, seedPrice) {
            try {
                // Primero comprar semillas
                const buyResponse = await fetch(`${API_BASE}/player/${PLAYER_ID}/buy-seeds`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ crop_type_id: cropTypeId, quantity: 1 })
                });

                if (!buyResponse.ok) {
                    const error = await buyResponse.json();
                    throw new Error(error.error || "Error buying seeds");
                }

                const buyResult = await buyResponse.json();

                // Luego plantar
                const plantResponse = await fetch(`${API_BASE}/plot/${currentPlotId}/plant`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ crop_type_id: cropTypeId })
                });

                if (!plantResponse.ok) throw new Error("Error al plantar");

                showMessage(`✅ ¡Semilla plantada! -$${seedPrice}`, "success");
                closePlantModal();
                setTimeout(() => {
                    loadPlayer();
                    loadFarms();
                }, 500);

            } catch (error) {
                showMessage("❌ " + error.message, "error");
            }
        }

        // ════════════════════════════════════════════════════════════════
        // ACCIONES - COSECHAR Y VENDER
        // ════════════════════════════════════════════════════════════════

        async function harvestAndSell(cropId, cropName, yieldAmount, cropPrice) {
            try {
                // 1. Primero cosechar
                const harvestResponse = await fetch(`${API_BASE}/crop/${cropId}/harvest`, {
                    method: "POST"
                });

                if (!harvestResponse.ok) {
                    const error = await harvestResponse.json();
                    throw new Error(error.error || "Error al cosechar");
                }

                showMessage(`✅ ¡Cosechado! ${yieldAmount} unidades`, "success");

                // 2. Luego abrir modal para vender
                setTimeout(() => {
                    openSellModal(cropId, cropName, yieldAmount, cropPrice);
                }, 500);

            } catch (error) {
                showMessage("❌ " + error.message, "error");
            }
        }

        function openSellModal(cropId, cropName, yieldAmount, cropPrice) {
            currentCropId = cropId;
            const totalValue = yieldAmount * cropPrice;

            document.getElementById("sellInfo").innerHTML = `
                <div style="text-align: center; margin-bottom: 30px;">
                    <div style="font-size: 3em; margin-bottom: 15px;">🌾</div>
                    <div style="font-size: 1.2em; font-weight: 700; color: var(--text-primary); margin-bottom: 10px;">${cropName}</div>
                    <div style="font-size: 1em; color: var(--text-secondary); margin-bottom: 20px;">
                        ${yieldAmount} units × $${cropPrice} = <strong style="color: var(--yellow-gold); font-size: 1.3em;">$${totalValue}</strong>
                    </div>
                </div>
                <button class="btn btn-sell" onclick="sellCrop()" style="width: 100%; margin-bottom: 10px;">
                    💰 Sell for $${totalValue}
                </button>
                <button class="btn btn-secondary" onclick="closeSellModal()" style="width: 100%;">
                    Cancel
                </button>
            `;

            document.getElementById("sellModal").classList.add("active");
        }

        function closeSellModal() {
            document.getElementById("sellModal").classList.remove("active");
        }

        async function sellCrop() {
            try {
                const response = await fetch(`${API_BASE}/crop/${currentCropId}/sell`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ player_id: PLAYER_ID })
                });

                if (!response.ok) throw new Error("Error al vender");

                const result = await response.json();
                showMessage(`✅ ¡Vendido! +$${result.total_revenue} 💸`, "success");
                closeSellModal();
                setTimeout(() => {
                    loadPlayer();
                    loadFarms();
                }, 500);

            } catch (error) {
                showMessage("❌ " + error.message, "error");
            }
        }

        // ════════════════════════════════════════════════════════════════
        // UI HELPERS
        // ════════════════════════════════════════════════════════════════

        function setPage(page) {
            currentPage = page;
            document.querySelectorAll(".nav-link").forEach(link => link.classList.remove("active"));
            event.target.closest(".nav-link").classList.add("active");

            const titles = {
                dashboard: "Dashboard",
                farm: "My Farm",
                properties: "Properties",
                market: "Market",
                inventory: "Inventory"
            };

            document.getElementById("pageTitle").textContent = titles[page];
        }

        function showMessage(text, type = "info") {
            const msgDiv = document.getElementById("message");
            msgDiv.textContent = text;
            msgDiv.className = `message ${type} show`;
            setTimeout(() => msgDiv.classList.remove("show"), 3500);
        }

        // ════════════════════════════════════════════════════════════════
        // COUNTDOWN TIMER
        // ════════════════════════════════════════════════════════════════

        function updateCountdowns() {
            const countdowns = document.querySelectorAll('.countdown');
            countdowns.forEach(el => {
                const id = el.id.replace('time-', '');
                const currentText = el.textContent;
                const parts = currentText.split(':').map(p => parseInt(p));

                let totalSeconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
                totalSeconds = Math.max(0, totalSeconds - 1);

                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;

                const newTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                el.textContent = newTime;

                // When countdown reaches 0, transform to ready card
                if (totalSeconds === 0) {
                    const plotCard = document.getElementById(`plot-${id}`);
                    if (plotCard) {
                        const cropId = plotCard.dataset.cropId;
                        const cropName = plotCard.dataset.cropName;
                        const yieldAmount = plotCard.dataset.yield;
                        const cropPrice = parseFloat(plotCard.dataset.price);
                        const totalValue = parseFloat(plotCard.dataset.total);

                        plotCard.classList.remove('with-crop');
                        plotCard.classList.add('ready');
                        plotCard.onclick = () => harvestAndSell(parseInt(cropId), cropName, parseInt(yieldAmount), cropPrice);

                        plotCard.innerHTML = `
                            <div class="plot-name">${plotCard.querySelector('.plot-name').textContent}</div>
                            <div class="plot-emoji">🌾</div>
                            <div class="plot-crop-name">${cropName}</div>
                            <div class="plot-price">💰 $${totalValue}</div>
                            <div class="plot-status">✨ Ready!</div>
                        `;
                    }
                }
            });
        }

        // Actualizar countdown cada segundo
        setInterval(updateCountdowns, 1000);

        // Modal close on outside click
        document.getElementById("plantModal").addEventListener("click", (e) => {
            if (e.target.id === "plantModal") closePlantModal();
        });

        document.getElementById("sellModal").addEventListener("click", (e) => {
            if (e.target.id === "sellModal") closeSellModal();
        });

        // ════════════════════════════════════════════════════════════════
        // START
        // ════════════════════════════════════════════════════════════════

        init();
    </script>
</body>
</html>
